# Favoriting a doctor, filtering by favorites, and keeping favorites across app restarts.
appId: org.reactjs.native.example.DoctoraAppointments
name: Favorites and filters
---
- launchApp:
    clearState: true
- runFlow: subflows/login-patient.yaml
- assertNotVisible: "Remove .* from favorites"
- tapOn: "Add .* to favorites"
- assertVisible: "Remove .* from favorites"
- tapOn: "♥ Favorites filter"
- assertVisible: "Remove .* from favorites"
- assertNotVisible: "Add .* to favorites"
- tapOn: "Clear all filters"
- assertVisible: "Add .* to favorites"
# Favorites are saved on the device
- launchApp
- assertVisible: "Find a Doctor"
- assertVisible: "Remove .* from favorites"
