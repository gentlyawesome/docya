# Creating a doctor account, editing the profile, and deleting the account (required by the App Store).
appId: org.reactjs.native.example.Docya
name: Register, edit profile, delete account
---
- launchApp:
    clearState: true
- assertVisible: "Welcome to Docya"
- tapOn: "Create an account"
# Validation
- tapOn: "Create account"
- assertVisible: "Enter your first name"
- assertVisible: "Enter a valid email address"
- assertVisible: "Enter your specialization"
- tapOn: "First name"
- inputText: "Eve"
- pressKey: Enter
- inputText: "Tester"
- pressKey: Enter
- inputText: "e2e-eve@doctora.test"
- pressKey: Enter
# (phone is optional) skip to the specialization
- pressKey: Enter
- inputText: "Dermatology"
- pressKey: Enter
- inputText: "Password123!"
- pressKey: Enter
- inputText: "Different123!"
- pressKey: Enter
- assertVisible: "Passwords do not match"
- tapOn: "Confirm password"
- eraseText: 30
- inputText: "Password123!"
- pressKey: Enter
# Where sign-up needs an emailed code (the local Docker copy), confirm it with the code from the local mail
# catcher. The hosted development project has email confirmation off and signs straight in.
- runFlow:
    when:
      visible: "We sent a code to.*"
    commands:
      - assertVisible: "We sent a code to.*"
      - tapOn: "Confirm"
      - assertVisible: "Enter the code from the email"
      - tapOn: "Code"
      - inputText: "000000"
      - tapOn: "Confirm"
      - assertVisible: "That code is wrong or has expired.*"
      - runScript:
          file: scripts/latest-code.js
          env:
            EMAIL: "e2e-eve@doctora.test"
      - tapOn: "Code"
      - eraseText: 10
      - inputText: ${output.code}
      - tapOn: "Confirm"
# Registered and signed in as a doctor
- runFlow: subflows/dismiss-welcome.yaml
- assertVisible: "Hello, Dr. Tester"
- tapOn: "Profile, tab.*"
- assertVisible: "My Profile"
- assertVisible: "e2e-eve@doctora.test"
# Edit personal information
- tapOn: "Phone"
- inputText: "+639171112222"
- scrollUntilVisible:
    element: "Save changes"
    centerElement: true
- tapOn: "Save changes"
- assertVisible: "Your details were updated."
- tapOn: "OK"
# Delete the account
- scrollUntilVisible:
    element: "Delete account"
    centerElement: true
- tapOn: "Delete account"
- assertVisible: "Delete your account\\?"
- tapOn: "Delete permanently"
- assertVisible: "Welcome to Docya"
# The deleted account can no longer sign in
- tapOn: "Email"
- inputText: "e2e-eve@doctora.test"
- pressKey: Enter
- inputText: "Password123!"
- pressKey: Enter
- assertVisible: "Invalid email or password."
