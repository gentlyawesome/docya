# A slot the doctor has given out is unavailable to them, and cancelling frees it again.
appId: org.reactjs.native.example.DoctoraAppointments
name: Given-out slots are unavailable until cancelled
---
- launchApp:
    clearState: true
- runFlow: subflows/login-doctor.yaml
- runFlow: subflows/schedule-patient.yaml
# Scheduling again shows the slot we just gave out as booked
- tapOn: "New appointment"
- tapOn: "Patient email"
- inputText: "patient1@doctora.test"
- pressKey: Enter
- assertVisible: "Pat Patient"
- scrollUntilVisible:
    element: ".*, booked"
    centerElement: true
- assertVisible: ".*, booked"
- tapOn: "Back"
# Cancel it from the list
- tapOn: "Cancel appointment with Pat Patient"
- tapOn: "Yes, cancel"
- assertVisible: "Upcoming \\(0\\) filter"
# The slot is free again
- tapOn: "New appointment"
- tapOn: "Patient email"
- inputText: "patient1@doctora.test"
- pressKey: Enter
- assertVisible: "Pat Patient"
- scrollUntilVisible:
    element: ".*, available"
    centerElement: true
- assertNotVisible: ".*, booked"
