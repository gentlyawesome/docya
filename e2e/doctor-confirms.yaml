# The whole loop across two accounts: a patient requests, the doctor confirms, the patient sees Confirmed.
appId: org.reactjs.native.example.DoctoraAppointments
name: Patient requests, doctor confirms
---
- launchApp:
    clearState: true
- runFlow: subflows/login-patient.yaml
# Book with Maria Santos, the seeded doctor this flow signs in as later
- tapOn: "Maria Santos.*View schedule"
- runFlow: subflows/book-slot.yaml
- tapOn: "OK"
- tapOn: "MainTabs.*"
- tapOn: "My Bookings, tab.*"
- assertVisible: "Awaiting confirmation"
- runFlow: subflows/sign-out.yaml

# The doctor sees the request and confirms it
- runFlow: subflows/login-doctor.yaml
- assertVisible: "Requests: 1"
- tapOn: "Appointments, tab.*"
- assertVisible: "Pending \\(1\\) filter"
- assertVisible: "Pat Patient.*"
- tapOn: "Confirm appointment with Pat Patient"
- tapOn: "Yes, confirm"
- assertVisible: "Pending \\(0\\) filter"
- tapOn: "Upcoming \\(1\\) filter"
- assertVisible: ".*Confirmed.*"
- runFlow: subflows/sign-out.yaml

# Back as the patient: now confirmed
- runFlow: subflows/login-patient.yaml
- tapOn: "My Bookings, tab.*"
- assertVisible: ".*Confirmed.*"
- assertNotVisible: ".*Awaiting confirmation.*"
