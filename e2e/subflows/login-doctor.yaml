# Signs in as a seeded LOCAL test doctor (supabase/seed.sql; never a real account).
appId: org.reactjs.native.example.Docya
---
- assertVisible: "Welcome to Docya"
- tapOn: "Email"
- inputText: "maria.santos@doctora.test"
- pressKey: Enter
- inputText: "Password123!"
- pressKey: Enter
# iOS may offer to save the password
- runFlow:
    when:
      visible: "Save Password.*"
    commands:
      - tapOn: "Not Now"
- assertVisible: "Hello, Dr. Santos"
