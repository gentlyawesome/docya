# Signs in as a seeded test doctor without dismissing the first-time welcome cards.
appId: org.reactjs.native.example.Docya
---
- assertVisible: "Welcome to Docya"
- tapOn: "Email"
- inputText: "maria.santos@doctora.test"
- pressKey: Enter
- inputText: "Password123!"
- pressKey: Enter
- runFlow:
    when:
      visible: "Save Password.*"
    commands:
      - tapOn: "Not Now"
