# As a signed-in doctor: schedule the first open slot for a patient named "Pat Patient".
# Picking the first open slot keeps flows independent of the time of day.
appId: org.reactjs.native.example.DoctoraAppointments
---
- tapOn: "Appointments, tab.*"
- tapOn: "New appointment"
- tapOn: "Patient name"
- inputText: "Pat Patient"
- pressKey: Enter
- inputText: "+639175550001"
- pressKey: Enter
- scrollUntilVisible:
    element: ".*, available"
    centerElement: true
- tapOn: ".*, available"
- assertVisible: "Schedule appointment\\?"
- tapOn: "Yes, schedule"
- assertVisible: "Appointment scheduled.*"
- tapOn: "OK"
