# As a signed-in doctor: schedule the first open slot for the seeded local test patient.
# Picking the first open slot keeps flows independent of the time of day.
appId: org.reactjs.native.example.DoctoraAppointments
---
- tapOn: "Appointments, tab.*"
- tapOn: "New appointment"
- tapOn: "Patient email"
- inputText: "patient1@doctora.test"
- pressKey: Enter
- assertVisible: "Pat Patient"
- scrollUntilVisible:
    element: ".*, available"
    centerElement: true
- tapOn: ".*, available"
- assertVisible: "Schedule appointment\\?"
- tapOn: "Yes, schedule"
- assertVisible: "Appointment scheduled.*"
- tapOn: "OK"
