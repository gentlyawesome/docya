# A doctor who forgot their password asks for a code, sets a new password, and signs in with it.
# The emailed codes are read from the local mail catcher.
appId: org.reactjs.native.example.Docya
name: Reset a forgotten password
---
- launchApp:
    clearState: true
# Create and confirm an account to reset
- tapOn: "Create an account"
- tapOn: "First name"
- inputText: "Rita"
- pressKey: Enter
- inputText: "Reset"
- pressKey: Enter
- inputText: "e2e-rita@doctora.test"
- pressKey: Enter
- pressKey: Enter
- inputText: "Neurology"
- pressKey: Enter
- inputText: "OldPassword1!"
- pressKey: Enter
- inputText: "OldPassword1!"
- pressKey: Enter
- runScript:
    file: scripts/latest-code.js
    env:
      EMAIL: "e2e-rita@doctora.test"
- tapOn: "Code"
- inputText: ${output.code}
- tapOn: "Confirm"
- runFlow: subflows/dismiss-welcome.yaml
- assertVisible: "Hello, Dr. Reset"
- runFlow: subflows/sign-out.yaml

# Forgot the password
- tapOn: "Forgot password\\?"
- tapOn: "Send code"
- assertVisible: "Enter a valid email address"
- tapOn: "Email"
- inputText: "e2e-rita@doctora.test"
- pressKey: Enter
- assertVisible: "We sent a code to e2e-rita@doctora.test.*"
# A wrong code is refused and nothing changes
- tapOn: "Code"
- inputText: "000000"
- pressKey: Enter
- inputText: "NewPassword1!"
- pressKey: Enter
- inputText: "NewPassword1!"
- pressKey: Enter
- assertVisible: "That code is wrong or has expired.*"
# The right code sets the new password and signs in
- runScript:
    file: scripts/latest-code.js
    env:
      EMAIL: "e2e-rita@doctora.test"
# (iOS clears a password field when it is entered again, so retype everything, as a person would)
- tapOn: "Code"
- eraseText: 10
- inputText: ${output.code}
- pressKey: Enter
- eraseText: 30
- inputText: "NewPassword1!"
- pressKey: Enter
- eraseText: 30
- inputText: "NewPassword1!"
- pressKey: Enter
- runFlow:
    when:
      visible: "Save Password.*"
    commands:
      - tapOn: "Not Now"
- runFlow: subflows/dismiss-welcome.yaml
- assertVisible: "Hello, Dr. Reset"
- runFlow: subflows/sign-out.yaml

# The old password no longer works; the new one does
- tapOn: "Email"
- inputText: "e2e-rita@doctora.test"
- pressKey: Enter
- inputText: "OldPassword1!"
- pressKey: Enter
- assertVisible: "Invalid email or password."
- tapOn: "Password"
- eraseText: 30
- inputText: "NewPassword1!"
- pressKey: Enter
- runFlow:
    when:
      visible: "Save Password.*"
    commands:
      - tapOn: "Not Now"
- runFlow: subflows/dismiss-welcome.yaml
- assertVisible: "Hello, Dr. Reset"
