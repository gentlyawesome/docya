# The whole loop across two accounts: the doctor schedules the patient, the patient sees it
# confirmed and cancels it, and the doctor sees the cancellation.
appId: org.reactjs.native.example.DoctoraAppointments
name: Doctor schedules a patient, patient cancels
---
- launchApp:
    clearState: true
- runFlow: subflows/login-doctor.yaml
- runFlow: subflows/schedule-patient.yaml
- assertVisible: "Upcoming \\(1\\) filter"
- assertVisible: "Pat Patient.*"
- assertVisible: ".*Confirmed.*"
- runFlow: subflows/sign-out.yaml

# The patient did nothing: it is simply there, already confirmed
- runFlow: subflows/login-patient.yaml
- tapOn: "My Bookings, tab.*"
- assertVisible: "Upcoming, 1"
- assertVisible: ".*Confirmed.*"
- assertNotVisible: ".*Awaiting confirmation.*"
- tapOn: "Cancel appointment with .*"
- assertVisible: "Are you sure you want to cancel.*"
- tapOn: "Yes, Cancel"
- assertVisible: "Your appointment has been cancelled."
- tapOn: "OK"
- assertVisible: "Upcoming, 0"
- assertVisible: "Past, 1"
- runFlow: subflows/sign-out.yaml

# Back as the doctor: the appointment is cancelled
- runFlow: subflows/login-doctor.yaml
- tapOn: "Appointments, tab.*"
- assertVisible: "Upcoming \\(0\\) filter"
- tapOn: "Past \\(1\\) filter"
- assertVisible: ".*Cancelled.*"
