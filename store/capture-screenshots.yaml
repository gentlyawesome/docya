# Step 2: take the five App Store screenshots. Run capture-warmup.yaml first. See store/README.md.
appId: org.reactjs.native.example.Docya
---
- launchApp
# The first-time welcome cards would cover the dashboard
- runFlow: ../e2e/subflows/dismiss-welcome.yaml
- assertVisible: "Hello, Dr. Santos"
# Looking at the working hours completes the "Getting started" checklist, which then hides itself
- tapOn: "Schedule, tab.*"
- assertVisible: "My Schedule"
- tapOn: "Dashboard, tab.*"
- assertVisible: "Hello, Dr. Santos"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 01-dashboard

- tapOn: "Appointments, tab.*"
- assertVisible: "Upcoming \\([0-9]+\\) filter"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 03-appointments

- tapOn: "New appointment"
- tapOn: "Patient name"
- inputText: "Sam Rivera"
- pressKey: Enter
- inputText: "+1 555 0136"
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 02-new-appointment
- tapOn: "Back"

- tapOn: "Schedule, tab.*"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 04-working-hours

- tapOn: "Profile, tab.*"
- scrollUntilVisible:
    element: "Remind me before each appointment"
    centerElement: true
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: 05-reminders
